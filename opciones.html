<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeelUp - ¿Qué quieres hacer?</title>
  <!-- Hoja de Estilos Externa -->
  <link rel="stylesheet" href="estilos-opciones.css">
</head>
<body>

  <div class="mobile-container">
    <div class="content">
      <div class="pantalla">
        <a href="index.html" class="btn-volver">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          Volver
        </a>

        <div class="welcome-card">
          <h1>¿Qué quieres hacer?</h1>
          <p>Elige por dónde empezar</p>
        </div>

        <div class="opciones">
        <a href="fase4.html" class="option-card">
          <div class="icon-box icon-box-retos"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>
          <div class="texto">
            <h3>Retos</h3>
            <p>Pequeños pasos...</p>
          </div>
          <svg class="ico chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <a href="chatbot.html" class="option-card">
          <div class="icon-box icon-box-chatbot"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
          <div class="texto">
            <h3>Hablar con el chatbot</h3>
            <p>Habla y desahógate</p>
          </div>
          <svg class="ico chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        <a href="fase3.html" class="option-card">
          <div class="icon-box icon-box-ejercicios"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></div>
          <div class="texto">
            <h3>Ejercicios</h3>
            <p>Relájate y respira</p>
          </div>
          <svg class="ico chevron" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
        </div>

        <!-- Nota al pie -->
        <div class="nota-chatbot">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <p><strong>NOTA:</strong> recuerda que el chatbot no reemplaza la ayuda de un profesional.</p>
        </div>

      </div>

    </div>

    <!-- Menú de Navegación Inferior -->
    <div class="nav-bar">
      <a href="#" class="nav-item active">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </a>
      <a href="#" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Explorar</span>
      </a>
      <a href="#" class="nav-item">
        <svg class="ico icon-add" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </a>
      <a href="#" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>Guardado</span>
      </a>
      <a href="#" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Perfil</span>
      </a>
    </div>
  </div>

</html>
