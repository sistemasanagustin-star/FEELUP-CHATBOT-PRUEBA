<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeelUp - Dashboard</title>
  <!-- Hoja de Estilos Externa -->
  <link rel="stylesheet" href="estilos2.css">
</head>
<body>

  <div class="mobile-container">
    <div class="content">

        <!-- Viñeta 1: Bienvenida -->
        <div class="welcome-card">
          <h1>¡Hola!</h1>
          <p>¿Cómo te sientes hoy?</p>
        </div>

        <!-- Viñeta 2: Estado de ánimo -->
        <div class="mood-card">
          <div class="mood-row">
          <button class="mood-btn" data-estado="Genial">
            <svg class="ico icon-genial" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 13h9a4.5 4.5 0 0 1-9 0z"/><path d="M8 9.5q1-1.2 2 0"/><path d="M14 9.5q1-1.2 2 0"/></svg>
            <span>Genial</span>
          </button>
          <button class="mood-btn" data-estado="Bien">
            <svg class="ico icon-bien" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            <span>Bien</span>
          </button>
          <button class="mood-btn" data-estado="Regular">
            <svg class="ico icon-regular" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            <span>Regular</span>
          </button>
          <button class="mood-btn" data-estado="Mal">
            <svg class="ico icon-mal" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
            <span>Mal</span>
          </button>
          <button class="mood-btn" data-estado="Muy mal">
            <svg class="ico icon-muy-mal" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M16 17s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/><path d="M8.5 11.5c-.7.9-1 1.5-1 2a1 1 0 0 0 2 0c0-.5-.3-1.100-1-2z"/></svg>
            <span>Muy mal</span>
          </button>
          </div>
        </div>

        <!-- Frase del día -->
        <div class="section-title">Frase del día</div>
        <div class="frase-card">
          <p>"No tienes que resolver todo hoy, está bien avanzar a tu ritmo."</p>
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>

    </div>

    <!-- Menú de Navegación Inferior -->
    <div class="nav-bar">
      <a href="#" class="nav-item active">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </a>
      <a href="#" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Explorar</span>
      </a>
      <a href="#" class="nav-item">
        <svg class="ico icon-add" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </a>
      <a href="#" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>Guardado</span>
      </a>
      <a href="#" class="nav-item">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Perfil</span>
      </a>
    </div>
  </div>

  <script>
    var botones = document.querySelectorAll('.mood-btn');

    // Al elegir cómo te sientes, pasa a la pantalla "¿Qué quieres hacer?"
    botones.forEach(function (boton) {
      boton.addEventListener('click', function () {
        botones.forEach(function (b) { b.classList.remove('selected'); });
        boton.classList.add('selected');
        // Guarda el estado por si lo quieres usar en otras pantallas
        localStorage.setItem('feelup_estado', boton.dataset.estado);
        // Pequeña pausa para que se vea la selección
        setTimeout(function () { window.location.href = 'opciones.html'; }, 350);
      });
    });
    
  </script>

</body>
</html>
